name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build · Balance gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Mobile browser layout
        run: npm run test:mobile

      - name: Viewport visual regression
        run: npm run test:viewport

      - name: Playtest smoke
        run: npm run test:playtest

      - name: Korea defense browser smoke
        run: npm run test:defense

      - name: Balance gates (smoke)
        # 小样本下胜率标准差会偏大；gates.ts 对 <50 战役 / <100 分关样本放宽。
        # --quiet 仍会打印失败门槛，避免再出现“只看到 exit 1”的日志。
        run: npm run sim -- --seeds=80 --campaign-seeds=20 --quiet

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/korea-tactics/dist/
            apps/jinyong-heroes/dist/
            apps/korea-defense/dist/
            apps/studio-site/dist/
          retention-days: 7
