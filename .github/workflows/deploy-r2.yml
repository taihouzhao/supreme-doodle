name: Deploy to R2

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印将要上传的文件，不真正写入 R2"
        type: boolean
        default: false

concurrency:
  group: deploy-r2
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and sync dist/ to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 兼容几种常见命名；密钥必须加在 Repository secrets（不是 Variables，也不是 Environment）
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check required secrets
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::缺少可用的 secret: $name"
              missing=1
            else
              echo "找到 $name（长度 ${#value}）"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            cat <<'EOF'

          Secrets 对 Actions 不可见。请到仓库：
            Settings → Secrets and variables → Actions → Repository secrets

          新增（名称必须精确匹配其一）：
            CLOUDFLARE_ACCOUNT_ID   或 CF_ACCOUNT_ID
            R2_ACCESS_KEY_ID       或 AWS_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY   或 AWS_SECRET_ACCESS_KEY
            R2_BUCKET_NAME         或 R2_BUCKET

          注意：
          - 要加在 Repository secrets，不是 Variables
          - 不要只加在 Environment（除非 workflow 声明了 environment:）
          - R2 API Token 的 Access Key / Secret Key，不是普通 Cloudflare API Token

          EOF
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm run test

      - name: Build
        run: npm run build

      - name: Mobile browser layout
        run: npm run test:mobile

      - name: Viewport visual regression
        run: npm run test:viewport

      - name: Sync dist/ to R2
        run: npm run deploy:r2

      - name: Summary
        if: success()
        run: |
          {
            echo "## R2 部署完成"
            echo ""
            echo "- Bucket: \`${R2_BUCKET_NAME}\`"
            echo "- Account: \`${CLOUDFLARE_ACCOUNT_ID}\`"
            echo "- Dry run: \`${DRY_RUN:-0}\`"
            echo ""
            echo "验证地址："
            echo "- 决战朝鲜 https://korea-tactics.dashjie.net/index.html"
            echo "- 金庸群侠传 https://korea-tactics.dashjie.net/jinyong-heroes/"
            echo "- 决战朝鲜：塔防 https://korea-tactics.dashjie.net/korea-defense/"
            echo "- 游戏目录 https://korea-tactics.dashjie.net/games/"
          } >> "$GITHUB_STEP_SUMMARY"
