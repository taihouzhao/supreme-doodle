<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Supreme Doodle</title>
  <meta name="description" content="控制涂鸦角色收集星星、躲避墨迹的静态网页小游戏" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app">
    <div class="stage">
      <canvas id="game" width="480" height="720" aria-label="游戏画布"></canvas>

      <div class="hud" id="hud" hidden>
        <div class="hud__score">分数 <span id="score">0</span></div>
        <div class="hud__lives" id="lives" aria-label="生命"></div>
        <button type="button" class="hud__pause" id="btn-pause" aria-label="暂停">Ⅱ</button>
      </div>

      <div class="panel" id="panel-title">
        <p class="panel__brand">Supreme Doodle</p>
        <h1 class="panel__title">涂鸦闯关</h1>
        <p class="panel__lead">收集星星，躲开飞溅的墨迹。</p>
        <button type="button" class="btn" id="btn-start">开始游戏</button>
        <p class="panel__hint">桌面：WASD / 方向键 · 手机：左下摇杆</p>
      </div>

      <div class="panel panel--dim" id="panel-paused" hidden>
        <p class="panel__brand">Supreme Doodle</p>
        <h2 class="panel__title">已暂停</h2>
        <div class="panel__actions">
          <button type="button" class="btn" id="btn-resume">继续</button>
          <button type="button" class="btn btn--ghost" id="btn-to-title">回标题</button>
        </div>
      </div>

      <div class="panel panel--dim" id="panel-gameover" hidden>
        <p class="panel__brand">Supreme Doodle</p>
        <h2 class="panel__title">本局结束</h2>
        <p class="panel__lead">得分 <strong id="final-score">0</strong></p>
        <button type="button" class="btn" id="btn-restart">再来一局</button>
      </div>

      <div class="stick" id="stick" aria-hidden="true">
        <div class="stick__base">
          <div class="stick__knob" id="stick-knob"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
