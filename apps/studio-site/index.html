<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大杰游戏</title>
    <meta name="description" content="决战朝鲜、金庸群侠传等网页游戏目录。" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12110f;
        --card: #1c1a17;
        --ink: #efe9dc;
        --muted: #9a9386;
        --line: #3a362f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Serif SC", "Songti SC", serif;
        background: var(--bg);
        color: var(--ink);
        padding: 48px 24px;
      }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 2rem; letter-spacing: 0.18em; margin: 0 0 0.5rem; }
      .lede { color: var(--muted); margin: 0 0 2rem; }
      .grid { display: grid; gap: 1rem; }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        padding: 1.25rem 1.4rem;
      }
      a.card:hover { border-color: #c9b896; }
      .status {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }
      h2 { margin: 0 0 0.35rem; font-size: 1.35rem; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>大杰游戏</h1>
      <p class="lede">同一仓库里的多款网页游戏。决战朝鲜仍在站点根路径，其它游戏使用独立前缀。</p>
      <div class="grid">
        <a class="card" href="../index.html">
          <div class="status">可玩</div>
          <h2>决战朝鲜</h2>
          <p>十二关朝鲜战争历史战棋。点击进入原地址。</p>
        </a>
        <a class="card" href="../jinyong-heroes/index.html">
          <div class="status">攻略重建</div>
          <h2>金庸群侠传</h2>
          <p>Classic Engine 行走试玩。按公开攻略重建《连城诀》，自绘高清占位，尚未导入原版资源。</p>
        </a>
      </div>
    </main>
  </body>
</html>
