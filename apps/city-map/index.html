<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>虚构卫星地图 · 大杰游戏</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .hud {
        position: fixed;
        z-index: 10;
        color: #e8eef7;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hud-top {
        top: 14px;
        left: 16px;
      }
      #hud-top h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      #hud-top p {
        margin: 4px 0 0;
        font-size: 12px;
        opacity: 0.75;
      }
      #hud-bottom {
        bottom: 14px;
        left: 16px;
        font-size: 12px;
        opacity: 0.8;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      #hud-actions {
        top: 14px;
        right: 16px;
        pointer-events: auto;
        display: flex;
        gap: 8px;
      }
      #hud-actions button {
        font: inherit;
        font-size: 13px;
        color: #e8eef7;
        background: rgba(15, 25, 42, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }
      #hud-actions button:hover {
        background: rgba(40, 60, 95, 0.85);
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9fb4d4;
        font-size: 14px;
        letter-spacing: 0.2em;
        background: #0b1220;
        transition: opacity 0.5s;
      }
      #loading.hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="hud-top">
      <h1>虚构卫星地图 · NOVA CITY</h1>
      <p id="hud-stats">生成中…</p>
    </div>
    <div class="hud" id="hud-actions">
      <button id="btn-regen" type="button">换一座城市</button>
      <button id="btn-topdown" type="button">正射俯瞰</button>
    </div>
    <div class="hud" id="hud-bottom">
      <span>拖拽平移 · 滚轮缩放 · 右键旋转</span>
      <span id="hud-fps"></span>
    </div>
    <div id="loading">正在从轨道拍摄城市…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
