<g filter="url(#paper)"><path d="M360 420 C350 305 385 175 360 30" class="road"/><rect x="180" y="115" width="360" height="215" rx="107.5" fill="#9d8c6630" stroke="#9d8c66" stroke-dasharray="7 7"/><text x="360" y="133" text-anchor="middle" class="area">铁原盆地与道路走廊</text><path d="M315 385 L340 300" class="arrow" marker-end="url(#arrow)"/><text x="327.5" y="334.5" text-anchor="middle" class="arrow-label">步坦追击</text><path d="M410 385 L385 300" class="arrow" marker-end="url(#arrow)"/><rect x="352" y="47" width="16" height="16" rx="2" fill="#cda96b" stroke="#281f18"/><text x="376" y="60" class="label">北撤区 / 纵深</text><path d="M248 183 L260 165 L272 183Z" fill="#87906c" stroke="#281f18"/><text x="276" y="180" class="label">纵深掩护线</text><path d="M443 258 L455 240 L467 258Z" fill="#87906c" stroke="#281f18"/><text x="471" y="255" class="label">前沿迟滞线（可放弃）</text><circle cx="360" cy="405" r="7" fill="#c47159" stroke="#281f18"/><text x="376" y="410" class="label">涟川方向（追击来向）</text></g>
<rect x="16" y="14" width="688" height="50" rx="8" fill="#181511dd"/><text x="30" y="38" class="title">铁原弹性阻击与北撤</text><text x="30" y="56" class="sub">前沿迟滞 → 纵深掩护 → 北侧撤离</text>
